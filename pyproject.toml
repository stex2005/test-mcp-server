[project]
name = "test-mcp"
version = "0.1.0"
description = "Test MCP server for testing submodule integration"
requires-python = ">=3.10"

dependencies = [
    "fastmcp>=2.11.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["test_mcp", "test_mcp.tools", "test_mcp.resources", "test_mcp.prompts"]
